<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamza.OC - Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Main container -->
    <div class="container">
        <!-- Main chat area -->
        <div class="chat-area">
            <!-- Toggle sidebar button -->
            <button class="toggle-sidebar" id="toggleSidebar">
                <i class="fas fa-bars"></i>
            </button>
            
            <!-- Chat header -->
            <div class="chat-header">
                <div class="chat-title">Hamza.OC</div>
                <div class="header-actions">
                    <button class="header-button" id="sandboxButton" title="Ouvrir le Code Sandbox">
                        <i class="fas fa-code"></i>
                    </button>
                    <button class="ephemeral-toggle" id="ephemeralToggle" title="Messages éphémères (5 minutes)">
                        <i class="fas fa-ghost"></i>
                    </button>
                </div>
            </div>
            
            <!-- Chat messages display -->
            <div class="messages-container" id="messagesContainer">
                <div class="welcome-message" id="welcomeMessage">
                    <div class="welcome-text">Comment puis-je vous aider ?</div>
                </div>
                <!-- Messages will be inserted here dynamically -->
            </div>
            
            <!-- Input area -->
            <div class="input-area">
                <div class="input-container">
                    <textarea 
                        id="messageInput" 
                        placeholder="Écrivez votre message ici..." 
                        rows="1"
                    ></textarea>
                    <button id="sendButton" class="send-button">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                
                <!-- Special modes buttons -->
                <div class="special-buttons">
                    <button id="deepSearchButton" class="mode-button" title="DeepSearch">
                        <i class="fas fa-search"></i> DeepSearch
                    </button>
                    <button id="deepThinkButton" class="mode-button" title="DeepThink">
                        <i class="fas fa-brain"></i> DeepThink
                    </button>
                    <div class="image-upload">
                        <label for="imageInput" class="mode-button" title="Ajouter une image">
                            <i class="fas fa-image"></i> Image
                        </label>
                        <input type="file" id="imageInput" accept="image/*" style="display: none;">
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Sidebar (chat history) -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Discussions</h2>
                <button id="newChatButton" class="new-chat-button">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            
            <div class="chat-history" id="chatHistory">
                <!-- Chat history items will be inserted here dynamically -->
            </div>
        </div>
    </div>
    
    <!-- Confirmation modal -->
    <div class="modal" id="confirmationModal">
        <div class="modal-content">
            <div class="modal-message">
                Je ne suis pas encore au courant de ces concepts, voulez-vous que je cherche ailleurs ?
            </div>
            <div class="modal-buttons">
                <button id="confirmYes" class="confirm-button yes">Oui</button>
                <button id="confirmNo" class="confirm-button no">Non</button>
            </div>
        </div>
    </div>
    
    <!-- Loading indicator -->
    <div class="loading-indicator" id="loadingIndicator">
        <div class="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
    
    <script>
        // Pass the initial chat ID to JavaScript
        const initialChatId = "{{ chat_id }}";
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
